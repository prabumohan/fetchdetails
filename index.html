<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your IP Address</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 30px;
        }
        
        #ip {
            font-size: 2rem;
            font-family: 'Courier New', monospace;
            color: #667eea;
            font-weight: bold;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            margin: 20px 0;
            word-break: break-all;
        }
        
        .loading {
            color: #666;
            font-size: 1.2rem;
        }
        
        .error {
            color: #e74c3c;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your IP Address</h1>
        <div id="ip" class="loading">Loading...</div>
    </div>

    <script>
        async function fetchIP() {
            try {
                const response = await fetch('/api/ip');
                if (!response.ok) {
                    throw new Error('Failed to fetch IP');
                }
                const data = await response.json();
                const ipElement = document.getElementById('ip');
                ipElement.textContent = data.ip || 'Unknown';
                ipElement.className = '';
            } catch (error) {
                const ipElement = document.getElementById('ip');
                ipElement.textContent = 'Error loading IP address';
                ipElement.className = 'error';
            }
        }

        fetchIP();
    </script>
</body>
</html>
